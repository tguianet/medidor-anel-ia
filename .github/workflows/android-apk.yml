name: App Android (APK)

# Gera o app Android instalável (APK) a cada push no branch app-android.
# O APK fica disponível em Releases (tag "app-android-latest") e em Actions.
on:
  push:
    branches: [app-android]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar o site (dist)
        run: npm run build

      - name: Criar projeto Android
        run: npx cap add android

      - name: Permissão de câmera e tela em pé
        run: node scripts/android-permissions.cjs

      - name: Ícone e tela de abertura
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor "#0d0d0d" --splashBackgroundColor "#0d0d0d"

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk medidor-de-anel.apk

      - uses: actions/upload-artifact@v4
        with:
          name: medidor-de-anel-apk
          path: medidor-de-anel.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-android-latest
          name: Medidor de Anel — APK de teste
          prerelease: true
          make_latest: false
          files: medidor-de-anel.apk
          body: |
            APK de teste do Medidor de Anel (Android), gerado automaticamente do branch app-android.
            Commit: ${{ github.sha }}
            Instalar: baixe medidor-de-anel.apk no celular e abra o arquivo (permita "instalar apps desconhecidos").
