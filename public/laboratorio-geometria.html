<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometria do cartão — laboratório V2</title><style>body{font:16px system-ui;background:#111820;color:#eaf0f5;max-width:830px;margin:auto;padding:18px}section{background:#1c2935;padding:18px;border-radius:12px;margin:14px 0}input,button{font:inherit;padding:10px;border-radius:8px}button{background:#2776d5;color:white;border:0;margin:5px}img{width:100%;display:block}#frame{position:relative}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}polygon{fill:#00ffaa16;stroke:#00edab;stroke-width:.5}p{line-height:1.5}small{color:#c9d6de}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #53616d;text-align:left}.warning{color:#ffd080}</style></head><body><h2>Laboratório de geometria — Medidor V2</h2><p>Ferramenta separada: recupera a foto e as quatro linhas do diagnóstico, resolve o quadrilátero por interseções e calcula a transformação projetiva do cartão de 85,60 × 53,98 mm. Não modifica a V2.</p><section><label>Diagnóstico completo (.json) <input type="file" id="file" accept=".json"></label><p id="status">Escolha um arquivo de diagnóstico da V2.</p></section><section id="out" hidden><div id="frame"><img id="photo"><svg id="overlay" viewBox="0 0 100 100" preserveAspectRatio="none"><polygon id="quad"></polygon></svg></div><table><tbody id="data"></tbody></table><p id="note" class="warning"></p><button id="download">Baixar análise JSON</button></section><script>
const $=x=>document.getElementById(x);let analysis=null;
function ix(a,b){const u={x:a.b.x-a.a.x,y:a.b.y-a.a.y},v={x:b.b.x-b.a.x,y:b.b.y-b.a.y},w={x:b.a.x-a.a.x,y:b.a.y-a.a.y},d=u.x*v.y-u.y*v.x;if(Math.abs(d)<1e-8)throw Error('Linhas paralelas ou degeneradas');const t=(w.x*v.y-w.y*v.x)/d;return{x:a.a.x+t*u.x,y:a.a.y+t*u.y}}
function solve(a,b){for(let i=0;i<b.length;i++){let p=i;for(let j=i+1;j<b.length;j++)if(Math.abs(a[j][i])>Math.abs(a[p][i]))p=j;if(Math.abs(a[p][i])<1e-10)throw Error('Geometria degenerada');[a[i],a[p]]=[a[p],a[i]];[b[i],b[p]]=[b[p],b[i]];const q=a[i][i];for(let k=i;k<b.length;k++)a[i][k]/=q;b[i]/=q;for(let j=0;j<b.length;j++){if(j===i)continue;const v=a[j][i];for(let k=i;k<b.length;k++)a[j][k]-=v*a[i][k];b[j]-=v*b[i]}}return b}
function fit(c,w,h){const target=[[0,0],[w,0],[w,h],[0,h]],a=[],b=[];c.forEach((p,i)=>{const [X,Y]=target[i],x=p.x,y=p.y;a.push([x,y,1,0,0,0,-X*x,-X*y]);b.push(X);a.push([0,0,0,x,y,1,-Y*x,-Y*y]);b.push(Y)});const z=solve(a,b);return [...z,1]}
function project(H,p){const d=H[6]*p.x+H[7]*p.y+1;return{x:(H[0]*p.x+H[1]*p.y+H[2])/d,y:(H[3]*p.x+H[4]*p.y+H[5])/d}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function row(k,v){const tr=document.createElement('tr');[k,v].forEach(t=>{const td=document.createElement('td');td.textContent=t;tr.append(td)});$('data').append(tr)}
$('file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;const d=JSON.parse(await f.text()),l=d.card?.cardLines;if(!l?.left||!l?.right||!l?.top||!l?.bottom||!d.image?.photoDataUrl)throw Error('Diagnóstico incompleto');const c=[ix(l.left,l.top),ix(l.right,l.top),ix(l.right,l.bottom),ix(l.left,l.bottom)],w=Number(d.card.physicalWidthMm),h=Number(d.card.physicalHeightMm);if(!(w>0&&h>0))throw Error('Dimensões físicas ausentes');const H=fit(c,w,h);const samples=[.1,.5,.9].map(t=>{const left={x:c[0].x*(1-t)+c[3].x*t,y:c[0].y*(1-t)+c[3].y*t},right={x:c[1].x*(1-t)+c[2].x*t,y:c[1].y*(1-t)+c[2].y*t};return{heightFraction:t,widthInOverlayUnits:dist(left,right),widthRectifiedMm:dist(project(H,left),project(H,right))}});const diag=d.finger?.widthAnalysis||{};$('data').replaceChildren();row('Referência física',w.toFixed(2)+' × '+h.toFixed(2)+' mm');row('Escala original V2',Number(d.card.pixelsPerMm).toFixed(4)+' px/mm');row('Largura original do dedo',Number(d.finger.widthSentToFormulaMm).toFixed(3)+' mm');row('Cardângulo superior (esq./dir.)',dist(c[0],c[1]).toFixed(3)+' unidades visuais');row('Cardângulo inferior (esq./dir.)',dist(c[3],c[2]).toFixed(3)+' unidades visuais');row('Diferença proporcional topo/base',((dist(c[0],c[1])/dist(c[3],c[2])-1)*100).toFixed(2)+' %');row('Geometria retificada (topo/meio/base)',samples.map(x=>x.widthRectifiedMm.toFixed(2)).join(' / ')+' mm');row('Dados de análise de bordas',Object.keys(diag).length+' campos no diagnóstico');$('photo').src=d.image.photoDataUrl;$('quad').setAttribute('points',c.map(p=>p.x+','+p.y).join(' '));$('note').textContent='A homografia corrige a perspectiva do plano do cartão, não a profundidade ou a curvatura do dedo. Não recalcula os 50 cortes nem altera o aro. A conferência real das bordas exige as coordenadas de cada corte ou reprocessamento da fotografia.';analysis={schema:'v2-geometria-plana-lab-1',sourceCapturedAt:d.capturedAt,physicalCardMm:{width:w,height:h},cornersPercent:c,homographyNormalizedPercentToMm:H,physicalWidthSamples:samples,originalFingerWidthMm:d.finger.widthSentToFormulaMm,edgeAnalysisAvailable:Object.keys(diag),limitations:['Apenas plano do cartao','Nao reprojeta largura do dedo sem posicao dos cortes','Nao executa detector de bordas']};$('out').hidden=false;$('status').textContent='Geometria calculada em '+f.name}catch(err){$('status').textContent='Erro: '+err.message;$('out').hidden=true}};
$('download').onclick=()=>{if(!analysis)return;const blob=new Blob([JSON.stringify(analysis,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='diagnostico-geometria-v2.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};
</script></body></html>
