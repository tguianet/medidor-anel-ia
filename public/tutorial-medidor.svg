<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" role="img" aria-label="Como medir o tamanho do seu anel em quatro passos">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100d09"/><stop offset="1" stop-color="#1b140a"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f8dc82"/><stop offset=".5" stop-color="#d5a93d"/><stop offset="1" stop-color="#ffe9a3"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#125bd7"/><stop offset="1" stop-color="#0b36a1"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#f8f4eb}
    .g{fill:#f2c85b}.muted{fill:#d9d0c2}.panel{fill:#14100b;stroke:#d9b54f;stroke-width:2}
    .h{font-size:25px;font-weight:700}.p{font-size:18px}.s{font-size:16px}.num{font-size:46px;font-weight:800}
  </style>
</defs>
<rect width="720" height="1280" fill="url(#bg)"/>
<text class="t muted" x="360" y="34" text-anchor="middle" font-size="18">A medição do dedo usa duas fotos: primeiro calibre o cartão em uma base plana;</text>
<text class="t muted" x="360" y="58" text-anchor="middle" font-size="18">depois fotografe o cartão sobre o dedo e ajuste a medida na parte mais grossa.</text>

<rect x="18" y="82" width="684" height="1172" rx="28" fill="#0f0c08" stroke="#e3bd50" stroke-width="2"/>
<text class="t" x="360" y="122" text-anchor="middle" font-size="28" font-weight="700">COMO MEDIR O</text>
<text x="360" y="164" text-anchor="middle" font-family="Arial" font-size="38" font-weight="800" fill="url(#gold)">TAMANHO DO SEU ANEL</text>
<line x1="52" y1="145" x2="135" y2="145" stroke="#d7b34c" stroke-width="2"/><line x1="585" y1="145" x2="654" y2="145" stroke="#d7b34c" stroke-width="2"/>
<circle cx="658" cy="128" r="18" fill="none" stroke="#e5bd50" stroke-width="3"/><path d="M649 108h18l-9-12z" fill="none" stroke="#e5bd50" stroke-width="2"/>

<!-- STEP 1 -->
<rect class="panel" x="34" y="188" width="652" height="240" rx="18"/>
<circle cx="84" cy="232" r="34" fill="#17110a" stroke="#e6c55e" stroke-width="2"/><text class="g num" x="84" y="248" text-anchor="middle">1</text>
<text class="t h" x="132" y="224">TIRE A FOTO DO CARTÃO</text>
<text class="t p" x="132" y="264"><tspan x="132" dy="0">Coloque o cartão em uma base</tspan><tspan x="132" dy="26">plana. Ajuste as linhas laterais</tspan><tspan x="132" dy="26">até ficarem verdes; a linha central</tspan><tspan x="132" dy="26">será posicionada automaticamente.</tspan><tspan x="132" dy="26">Quando tudo estiver verde,</tspan><tspan x="132" dy="26" fill="#f2c85b" font-weight="700">toque em CAPTURAR.</tspan></text>
<rect x="438" y="220" width="210" height="126" rx="12" fill="#2a2118"/>
<rect x="468" y="244" width="150" height="78" rx="10" fill="url(#card)" stroke="#d7e7ff" stroke-width="2"/>
<rect x="484" y="261" width="24" height="18" rx="3" fill="#e9c66c"/><text class="t" x="485" y="297" font-size="12">CARTÃO EXEMPLO</text>
<line x1="456" y1="232" x2="456" y2="334" stroke="#5cff75" stroke-width="4" filter="url(#glow)"/><line x1="630" y1="232" x2="630" y2="334" stroke="#5cff75" stroke-width="4" filter="url(#glow)"/><line x1="544" y1="226" x2="544" y2="338" stroke="#fff" stroke-dasharray="8 7" stroke-width="2"/>
<rect x="466" y="354" width="154" height="48" rx="24" fill="#050505" stroke="#e8c85d" stroke-width="2"/><text class="t" x="543" y="386" text-anchor="middle" font-size="17" font-weight="700">📷  CAPTURAR</text>

<!-- STEP 2 -->
<rect class="panel" x="34" y="444" width="652" height="254" rx="18"/>
<circle cx="84" cy="490" r="34" fill="#17110a" stroke="#e6c55e" stroke-width="2"/><text class="g num" x="84" y="506" text-anchor="middle">2</text>
<text class="t h" x="132" y="480">TIRE A FOTO DO CARTÃO</text><text class="t h" x="132" y="512">SOBRE O DEDO</text>
<text class="t p" x="132" y="550"><tspan x="132">Coloque o cartão sobre o dedo</tspan><tspan x="132" dy="26">que será medido. O dedo deve</tspan><tspan x="132" dy="26">ficar alinhado na linha guia.</tspan><tspan x="132" dy="26">Faça a foto na </tspan><tspan fill="#f2c85b" font-weight="700">parte mais grossa</tspan><tspan x="132" dy="26">do dedo, como a junta ou a falange.</tspan><tspan x="132" dy="26">Quando o alinhamento estiver verde,</tspan><tspan x="132" dy="26" fill="#f2c85b" font-weight="700">toque em CAPTURAR.</tspan></text>
<!-- hand -->
<rect x="450" y="456" width="188" height="222" rx="18" fill="#3c281d"/>
<rect x="469" y="474" width="37" height="190" rx="18" fill="#d99a76"/><rect x="510" y="462" width="39" height="202" rx="18" fill="#e4a37d"/><rect x="554" y="470" width="37" height="194" rx="18" fill="#d99a76"/><rect x="595" y="488" width="31" height="176" rx="16" fill="#cd8966"/>
<rect x="468" y="525" width="150" height="78" rx="10" fill="url(#card)" stroke="#d7e7ff" stroke-width="2"/><rect x="484" y="542" width="24" height="18" rx="3" fill="#e9c66c"/><text class="t" x="485" y="578" font-size="12">CARTÃO EXEMPLO</text>
<line x1="458" y1="514" x2="458" y2="614" stroke="#5cff75" stroke-width="4" filter="url(#glow)"/><line x1="628" y1="514" x2="628" y2="614" stroke="#5cff75" stroke-width="4" filter="url(#glow)"/><line x1="544" y1="466" x2="544" y2="664" stroke="#fff" stroke-dasharray="8 7" stroke-width="2"/>
<rect x="472" y="620" width="146" height="44" rx="22" fill="#050505" stroke="#e8c85d" stroke-width="2"/><text class="t" x="545" y="649" text-anchor="middle" font-size="16" font-weight="700">📷 CAPTURAR</text>

<!-- STEP 3 -->
<rect class="panel" x="34" y="714" width="652" height="218" rx="18"/>
<circle cx="84" cy="760" r="34" fill="#17110a" stroke="#e6c55e" stroke-width="2"/><text class="g num" x="84" y="776" text-anchor="middle">3</text>
<text class="t h" x="132" y="752">AJUSTE A LINHA MAGNÉTICA</text>
<text class="t p" x="132" y="792"><tspan x="132">Depois da foto, aproxime as linhas</tspan><tspan x="132" dy="26">magnéticas laterais até encostarem</tspan><tspan x="132" dy="26">na parte mais grossa do dedo,</tspan><tspan x="132" dy="26">exatamente na região onde</tspan><tspan x="132" dy="26">o anel vai passar.</tspan></text>
<rect x="480" y="734" width="120" height="180" rx="52" fill="#d99570"/>
<ellipse cx="540" cy="804" rx="46" ry="34" fill="#c98564" opacity=".75"/>
<line x1="468" y1="746" x2="468" y2="898" stroke="#5cff75" stroke-width="4" filter="url(#glow)"/><line x1="612" y1="746" x2="612" y2="898" stroke="#5cff75" stroke-width="4" filter="url(#glow)"/>
<circle cx="468" cy="814" r="10" fill="#172213" stroke="#6fff70" stroke-width="4"/><circle cx="612" cy="814" r="10" fill="#172213" stroke="#6fff70" stroke-width="4"/><text x="449" y="822" fill="#6fff70" font-size="28">›</text><text x="625" y="822" fill="#6fff70" font-size="28">‹</text>

<!-- STEP 4 -->
<rect class="panel" x="34" y="948" width="652" height="280" rx="18"/>
<circle cx="84" cy="994" r="34" fill="#17110a" stroke="#e6c55e" stroke-width="2"/><text class="g num" x="84" y="1010" text-anchor="middle">4</text>
<text class="t h" x="132" y="988">USE O NÚMERO CERTO</text>
<text class="t p" x="132" y="1030"><tspan x="132">O número exato é o que</tspan><tspan x="132" dy="27">encaixa no dedo.</tspan><tspan x="132" dy="27">O número de conforto</tspan><tspan x="132" dy="27">é o tamanho com uma folga,</tspan><tspan x="132" dy="27">ideal para passar pela junta</tspan><tspan x="132" dy="27">e ficar mais confortável.</tspan></text>
<rect x="418" y="970" width="248" height="230" rx="18" fill="#100d09" stroke="#d8b653" stroke-width="2"/>
<text class="t" x="542" y="998" text-anchor="middle" font-size="18" font-weight="700">SEU RESULTADO</text>
<rect x="432" y="1016" width="104" height="112" rx="10" fill="#090909" stroke="#8c7440"/><text class="t" x="484" y="1046" text-anchor="middle" font-size="13" font-weight="700">NÚMERO EXATO</text><text class="t" x="484" y="1102" text-anchor="middle" font-size="44" font-weight="800">21</text>
<rect x="548" y="1016" width="104" height="112" rx="10" fill="#151009" stroke="#f0cd65" stroke-width="3" filter="url(#glow)"/><text class="g" x="600" y="1042" text-anchor="middle" font-size="13" font-weight="700">NÚMERO DE</text><text class="g" x="600" y="1059" text-anchor="middle" font-size="13" font-weight="700">CONFORTO</text><text class="t" x="600" y="1102" text-anchor="middle" font-size="44" font-weight="800">22</text>
<rect x="558" y="1110" width="84" height="24" rx="12" fill="#f3c957"/><text x="600" y="1127" text-anchor="middle" font-family="Arial" font-size="11" font-weight="800" fill="#15100a">RECOMENDADO</text>
<text class="t muted" x="542" y="1164" text-anchor="middle" font-size="15">Ideal para passar pela junta</text><text class="t muted" x="542" y="1185" text-anchor="middle" font-size="15">e ficar confortável.</text>
</svg>